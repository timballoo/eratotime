name: Deploy Eratotime via Rsync

# Deploy-on-commit: push to main runs the test suite, then rsyncs the app to the
# book.meertec.ltd doc root on Hostinger. book.meertec.ltd maps to
# meertec.ltd/public_html/book/ (Hostinger-managed subdomain doc root).
# Secrets (.env, config.php) and user uploads are never deployed nor deleted
# (see .rsyncignore: `P` protects them). The idempotent schema is re-applied
# after each deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: eratotime_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=8
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sodium, pdo_mysql
          coverage: none

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if composer install --no-interaction --prefer-dist --no-progress; then
              echo "Composer install succeeded on attempt $attempt"
              break
            fi
            echo "Composer install attempt $attempt failed, retrying in 15s..."
            sleep 15
          done || { echo "Composer install failed after 3 attempts" && exit 1; }

      - name: Run test suite
        env:
          ERATO_TEST_DB_HOST: 127.0.0.1
          ERATO_TEST_DB_PORT: 3306
          ERATO_TEST_DB_USER: root
          ERATO_TEST_DB_PASS: root
          ERATO_TEST_DB_NAME: eratotime_test
        run: vendor/bin/phpunit --configuration phpunit.xml --no-coverage

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install production dependencies
        run: |
          for attempt in 1 2 3; do
            if composer install --no-interaction --prefer-dist --no-progress --no-dev; then
              echo "Composer install succeeded on attempt $attempt"
              break
            fi
            echo "Composer install attempt $attempt failed, retrying in 15s..."
            sleep 15
          done || { echo "Composer install failed after 3 attempts" && exit 1; }

      - name: Setup SSH key and known hosts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOSTINGER_IP: ${{ secrets.HOSTINGER_IP }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Auto-detect encoding to handle both raw and Base64 formatted secrets cleanly
          if echo "$SSH_PRIVATE_KEY" | grep -q "BEGIN OPENSSH PRIVATE KEY"; then
            echo "Detected RAW ED25519 key format. Writing directly..."
            echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          else
            echo "Detected BASE64 encoded key format. Decoding..."
            echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_ed25519
          fi

          # Fix the common ED25519 parsing error by ensuring a trailing newline
          echo "" >> ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Clean stale host key, then bootstrap with retry. Hostinger's SSH
          # daemon on the custom port often ignores ssh-keyscan (probe times
          # out with no reply), so record the host key via a real SSH handshake
          # with StrictHostKeyChecking=accept-new — it either connects and
          # stores the key, or the attempt fails and we retry.
          ssh-keygen -R "[${HOSTINGER_IP}]:65002" 2>/dev/null || true
          for attempt in 1 2 3; do
            if ssh -o BatchMode=yes -o ConnectTimeout=30 -p 65002 -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=accept-new "${HOSTINGER_USER}@${HOSTINGER_IP}" 'echo SSH_OK'; then
              echo "SSH auth + host key bootstrap succeeded on attempt $attempt"
              break
            fi
            echo "SSH attempt $attempt failed, retrying in 5s..."
            sleep 5
          done || { echo "SSH key auth failed after 3 attempts" && exit 1; }

      - name: Deploy via rsync
        env:
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_IP: ${{ secrets.HOSTINGER_IP }}
        run: |
          set -e

          RSYNC_SSH="ssh -p 65002 -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o KeepAlive=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=10 -o IdentitiesOnly=yes -o ConnectTimeout=30"
          REMOTE="/home/${HOSTINGER_USER}/domains/meertec.ltd/public_html/book/"

          for attempt in 1 2 3; do
            if rsync -avz --delete \
              --filter='merge .rsyncignore' \
              -e "$RSYNC_SSH" \
              ./ "${HOSTINGER_USER}@${HOSTINGER_IP}:${REMOTE}"; then
              echo "Deploy succeeded on attempt $attempt"
              break
            fi
            echo "Deploy attempt $attempt failed, retrying in 15s..."
            sleep 15
          done || { echo "Deploy failed after 3 attempts" && exit 1; }

      - name: Test SSH before migrations
        env:
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_IP: ${{ secrets.HOSTINGER_IP }}
        run: |
          echo "Testing SSH connection..."
          ls -la ~/.ssh/
          ssh -vvv -p 65002 -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 "${HOSTINGER_USER}@${HOSTINGER_IP}" 'echo SSH_OK' || true

      - name: Apply migrations (idempotent) + diagnostics
        env:
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_IP: ${{ secrets.HOSTINGER_IP }}
        run: |
          REMOTE="/home/${HOSTINGER_USER}/domains/meertec.ltd/public_html/book"
          ssh -p 65002 -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 "${HOSTINGER_USER}@${HOSTINGER_IP}" "echo SERVER_REACHED; echo '=== server ==='; php -v | head -1; echo '=== php extensions ==='; php -m | grep -E 'pdo_mysql|sodium' || echo '(pdo_mysql/sodium not found)'; echo '=== doc root files ==='; ls -la ${REMOTE} | grep -E '(^| )(\.env|config\.php|\.htaccess)$'; echo '=== presence ==='; [ -f ${REMOTE}/.env ] && echo '.env PRESENT' || echo '.env MISSING'; [ -f ${REMOTE}/config.php ] && echo 'config.php PRESENT' || echo 'config.php MISSING'; echo '=== migration (display_errors=1) ==='; cd ${REMOTE} && php -d display_errors=1 bin/migrate.php" > /tmp/migrate_out.txt 2>&1 || true
          echo "=== summary ==="
          grep -E 'PRESENT|MISSING|Applied|Fatal|Uncaught|denied|Unknown|refused|not found|configured|command not found|SERVER_REACHED' /tmp/migrate_out.txt | head -30 || true
          echo "=== full output (base64) ==="
          base64 /tmp/migrate_out.txt

      - name: Smoke check booking page
        run: |
          for attempt in 1 2 3; do
            if curl -sf -o /dev/null -w 'booking page HTTP %{http_code}\n' \
              https://book.meertec.ltd/t/meertec/book/30-min; then
              exit 0
            fi
            echo "Smoke check attempt $attempt failed, retrying in 10s..."
            sleep 10
          done
          echo 'booking page not ready (likely missing ERATO_DB_PASS in server .env)'
